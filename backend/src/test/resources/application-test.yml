spring:
  datasource:
    url: jdbc:h2:mem:contracts-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
app:
  allowed-origins: http://localhost:3000
  secure-cookies: false
  retention-hours: 24
  max-active-jobs-per-session: 2
  max-jobs-per-session-per-hour: 10
  max-pending-jobs: 50
  worker-enabled: false
  model:
    enabled: false
    base-url: https://api.openai.com/v1
    api-key: ""
    name: ""
