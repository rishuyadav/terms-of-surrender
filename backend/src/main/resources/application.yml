spring:
  application:
    name: terms-of-surrender
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./.data/contracts;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      request-timeout: 120000
  task:
    scheduling:
      pool:
        size: 3
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 11MB
    # Drain a bounded rejected request so clients receive 413 instead of a reset.
    max-swallow-size: 12MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  secure-cookies: ${SECURE_COOKIES:false}
  retention-hours: ${RETENTION_HOURS:24}
  max-active-jobs-per-session: 2
  max-jobs-per-session-per-hour: 10
  max-pending-jobs: 50
  worker-enabled: ${WORKER_ENABLED:true}
  ai-demo:
    enabled: ${AI_DEMO_ENABLED:false}
    proxy-secret: ${AI_DEMO_PROXY_SECRET:}
    analyses-per-ip: ${AI_DEMO_ANALYSES_PER_IP:5}
    questions-per-ip: ${AI_DEMO_QUESTIONS_PER_IP:8}
    max-characters: ${AI_DEMO_MAX_CHARACTERS:30000}
    max-completion-tokens: ${AI_DEMO_MAX_COMPLETION_TOKENS:4000}
  model:
    enabled: ${MODEL_ENABLED:false}
    base-url: ${MODEL_BASE_URL:https://api.openai.com/v1}
    api-key: ${MODEL_API_KEY:}
    name: ${MODEL_NAME:}
