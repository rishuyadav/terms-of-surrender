name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: contracts_test
          POSTGRES_USER: contracts
          POSTGRES_PASSWORD: local-ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contracts -d contracts_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify
      - name: Verify against PostgreSQL
        run: >-
          mvn -B -ntp verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/contracts_test
          -Dspring.datasource.username=contracts
          -Dspring.datasource.password=local-ci-only-password

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:18080
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    env:
      DATABASE_PASSWORD: local-ci-only-password
      WEB_PORT: "13001"
      ALLOWED_ORIGINS: http://localhost:13001
      MODEL_ENABLED: "false"
      E2E_EXTERNAL_SERVICES: "true"
      E2E_BASE_URL: http://localhost:13001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose -p tos-verification -f compose.yml -f compose.verification.yml up --build -d
      - run: curl --retry 30 --retry-all-errors --retry-delay 1 --fail http://localhost:13001/api/session
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -- --project=desktop --project=mobile
        working-directory: frontend
      - run: python3 scripts/verify-containers.py --engine docker
      - name: Container diagnostics
        if: failure()
        run: docker compose -p tos-verification -f compose.yml -f compose.verification.yml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: container-browser-test-results
          path: frontend/test-results
          retention-days: 7
      - name: Remove verification stack
        if: always()
        run: docker compose -p tos-verification -f compose.yml -f compose.verification.yml down --volumes
